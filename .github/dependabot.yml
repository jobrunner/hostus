# Dependabot configuration. See:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Three ecosystems:
#   1. github-actions — bumps actions/checkout, actions/setup-go, etc.
#   2. gomod          — bumps Go modules AND the `toolchain` directive in
#                       go.mod. This is what keeps us off the next round of
#                       stdlib CVEs without manual work.
#
# NOTE deliberately NOT listed: gitsubmodule. third_party/claude-skills is a
# PRIVATE same-owner repo, and Dependabot on a personal account cannot clone
# private repos — every weekly submodules job failed with "Repository not
# found" (run 34161940113, 2026-09-07). The pin is updated on demand via the
# "Update skills submodule" workflow_dispatch action instead.
#
# The CI workflows read the Go version via `go-version-file: go.mod` (the
# `toolchain` directive), so go.mod is the single source of truth — Dependabot
# bumping `gomod` keeps CI and the Dockerfile builder in sync automatically.
# The vuln-scan workflow runs weekly to alert if it drifts behind the toolchain
# directive.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      # All GitHub Actions bumps in ONE PR. They're independent, CI-only and
      # low-risk; a single PR avoids per-file rebase churn.
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    groups:
      # OTel ecosystem updates as one PR — they release in lockstep and
      # individual bumps usually break version-compat between sibling
      # packages.
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      # Everything else: remaining minor/patch bumps in ONE PR per week, so
      # go.mod/go.sum changes don't serialize into conflicting single-module
      # PRs. A dependency lands in the first matching group above, so a
      # lockstep group still captures its own bumps INCLUDING majors
      # (intentional — siblings must move together). Only a *major* bump of a
      # dependency matching none of those groups falls outside this
      # minor/patch catch-all and gets its own individual PR for review.
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
