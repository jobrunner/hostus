# Mutation testing with gremlins — a HARD GATE on the packages listed below.
# Coverage tells you a line executed; mutation testing tells you a test would
# actually CATCH a bug in it. Runs per-package via `make mutation PKG=...`,
# which reads thresholds from .gremlins.yaml.
#
# On the SP0 skeleton, .gremlins.yaml keeps threshold-efficacy/threshold-mcover
# at 0 (there is no logic yet to mutate) — these gates are effectively no-ops
# until real logic lands per task. Ratchet .gremlins.yaml (and this job, if
# per-package overrides are added there) up as tests improve; don't hardcode
# stricter numbers here than the shared config uses, or the two will drift.
name: Mutation Testing

on:
  # Runs on every PR to master (not path-filtered) so it can be a REQUIRED
  # status check — a path-filtered check that skips would leave the
  # requirement permanently unsatisfied and block unrelated PRs.
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
  workflow_dispatch:

env:
  GREMLINS_VERSION: 'v0.5.1'

permissions:
  contents: read

jobs:
  mutation:
    # One package per runner. Previously all packages ran sequentially in a single
    # job and the runner was OOM-killed on internal/adapters/telemetry: gremlins
    # recompiles the package once per mutant, that package pulls the whole
    # OpenTelemetry SDK, and the Go toolchain was measured locally peaking at
    # ~6.1 GB RSS against a 7 GB ubuntu-latest runner. It surfaced as "the runner
    # has received a shutdown signal" / exit 143 after 2-3 min against a 60 min
    # timeout -- which reads like a flake and is not one. A matrix gives each
    # package its own fresh 7 GB and runs them in parallel.
    name: gremlins (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # internal/adapters/telemetry reports but does not block (continue-on-error).
    # gremlins recompiles the package per mutant and this one pulls the whole
    # OpenTelemetry SDK, which blows the 7 GB ubuntu-latest ceiling: "the runner
    # has received a shutdown signal" / exit 143. Dropping the make() capacity
    # hint that used to be the worst offender (now `make(map[string]string)` in
    # RingLog.Handle) did NOT clear it — PR #33's CI reproduced the OOM at ~2 min
    # even without that mutant, so the cause is the per-mutant recompilation of
    # the SDK, not one allocation. The real fix is a larger runner
    # (ubuntu-latest-4-core or similar); none is configured for this repo, so
    # telemetry stays non-blocking. It is NOT unverified: locally it now runs to
    # completion at 100 % efficacy (56 killed / 0 lived / 0 not covered). See
    # docs/explanation/known-gaps.md.
    continue-on-error: ${{ matrix.pkg == './internal/adapters/telemetry' }}
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - ./internal/config
          - ./internal/httperr
          - ./internal/adapters/telemetry
          - ./internal/adapters/http
          - ./internal/app
          - ./internal/adapters/mcp
          - ./cmd/hostus
          # The three packages that carry the actual domain logic. They were
          # missing until SP6 Task 4, which meant `make mutation`'s
          # `Not covered = 0` gate never ran on any of the code it was added
          # for: the hoisted conditions in internal/domain/synonym.go
          # (ClassifyNomStatus/judgeSynonym) sit in ./internal/domain, and
          # `make verify` does not call `mutation` at all. Measured runtime
          # locally: domain 30 s, application 62 s, sqlite 154 s — under the
          # matrix these run in parallel on their own runners instead of
          # adding four minutes to a sequential loop.
          - ./internal/domain
          - ./internal/application
          - ./internal/adapters/sqlite
          # SP9 Task 1's new reader package. Added with the package itself:
          # a package that is not in this matrix has no `Not covered = 0`
          # gate in CI at all, no matter how green it is locally.
          - ./internal/adapters/namelist
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${{ env.GREMLINS_VERSION }}

      # DETERMINISM FIX (see docs/explanation/known-gaps.md): gremlins recompiles
      # the package once per mutant, and two packages each peak the *go build
      # subprocess* at ~6+ GB RSS — internal/adapters/telemetry (whole OTel SDK)
      # and internal/adapters/sqlite (modernc.org/sqlite pure-Go driver). That
      # over-runs the 7 GB ubuntu-latest ceiling, so the job was either OOM-killed
      # (exit 143) or thrashed at the memory limit until the 60 min timeout — a
      # non-deterministic outcome that reads like a flake. GOMEMLIMIT cannot fix
      # it: it bounds gremlins' own Go heap, not the child compiler process that
      # actually blows up. Swap gives that subprocess peak the headroom to
      # complete; it is only touched at peaks, so steady-state stays in RAM and
      # the wall-clock cost is small. This makes every leg terminate with a real
      # green/red instead of being killed. If the org later enables larger GitHub
      # runners, `runs-on: ubuntu-latest-4-core` (16 GB) is the simpler successor
      # and this step can be dropped.
      - name: Add swap headroom (deterministic OOM fix for heavy legs)
        run: |
          set -eux
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          swapon --show

      # Each package must meet its (currently permissive) baseline in
      # .gremlins.yaml, or gremlins exits non-zero and the job fails.
      # fail-fast: false keeps the other matrix legs running, so one failing
      # package still yields a report for every other one.
      - name: Run mutation testing
        # -p=1 serialises the Go compile actions (one heavy `go build` at a time)
        # and GOMEMLIMIT makes gremlins' own GC work harder before allocating; the
        # "Add swap headroom" step above is what actually absorbs the per-mutant
        # compiler-subprocess RSS peak that used to OOM-kill the heavy legs
        # (internal/adapters/telemetry, internal/adapters/sqlite). Together they
        # let every leg run to a deterministic conclusion on a 7 GB runner.
        env:
          GOFLAGS: -p=1
          GOMEMLIMIT: 4GiB
          # gremlins defaults its worker count to the CPU count, and each worker
          # holds its own recompilation of the package in memory. One worker is
          # what finally fits internal/adapters/telemetry (OTel SDK) into a 7 GB
          # runner; the matrix already restored the wall-clock the serialisation
          # costs by running all matrix packages in parallel.
          MUTATION_WORKERS: '1'
        run: |
          set -uo pipefail
          pkg='${{ matrix.pkg }}'
          echo "===== gremlins: $pkg =====" | tee -a mutation.log
          if ! make mutation PKG="$pkg" 2>&1 | tee -a mutation.log; then
            echo "::error::Mutation gate FAILED for $pkg — score below the .gremlins.yaml baseline, or the mutation gate in the Makefile tripped (uncovered mutants / no results). Add tests that kill the LIVED mutants in mutation.log, or (last resort) adjust the baseline in .gremlins.yaml with justification."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          summary=$(grep -iE 'gremlins:|Killed:|Test efficacy:|Mutator coverage:|LIVED|NOT COVERED' mutation.log 2>/dev/null | tail -60)
          {
            echo "### Mutation testing (gremlins) — ${{ matrix.pkg }}"
            echo '```'
            echo "${summary:-no summary captured}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: mutation.log
          if-no-files-found: ignore
