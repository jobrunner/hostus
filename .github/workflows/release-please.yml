# Release automation via release-please.
#
# On every push to master, release-please inspects the Conventional Commits
# since the last release and maintains a "release PR" that:
#   - bumps the VERSION file (generic updater, x-release-please-version marker),
#   - cuts CHANGELOG.md ([Unreleased]-style accumulation → a versioned section),
#   - and, when merged, tags vX.Y.Z + creates the GitHub Release.
#
# docker-release.yml watches for pushes to master and builds/pushes the image
# whenever the release-please release PR merges (VERSION changes).
name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release PR, tag, and GitHub Release
      pull-requests: write   # open/maintain the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Mint a short-lived installation token for the "release-please-fieldworksdiary"
      # GitHub App (Contents + Pull requests, both read/write) instead of a
      # long-lived PAT: release-please's commits on the release PR need to
      # TRIGGER required-status-check workflows, which commits pushed with the
      # default GITHUB_TOKEN do NOT (GitHub's workflow loop-prevention) — that
      # leaves the release PR permanently BLOCKED once checks are required. An
      # App token has the same effect as a PAT here but is scoped to this repo,
      # short-lived, and revoked automatically at the end of the job. Verified
      # 2026-08-30: token minting succeeds and a write (branch create+delete)
      # succeeds — the repo-permissions field GitHub's REST API reports for an
      # App token is a classic-collaborator artifact and always reads false,
      # not a signal of the App's actual grant.
      - name: Generate release-please App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          # Narrow the minted token to exactly what release-please needs,
          # rather than inheriting the App's whole installation grant
          # (zizmor github-app finding).
          permission-contents: write
          permission-pull-requests: write

      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
