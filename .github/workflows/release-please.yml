# Release automation via release-please.
#
# On every push to master, release-please inspects the Conventional Commits
# since the last release and maintains a "release PR" that:
#   - bumps the VERSION file (generic updater, x-release-please-version marker),
#   - cuts CHANGELOG.md ([Unreleased]-style accumulation → a versioned section),
#   - and, when merged, tags vX.Y.Z + creates the GitHub Release.
#
# docker-release.yml watches for pushes to master and builds/pushes the image
# whenever the release-please release PR merges (VERSION changes).
name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release PR, tag, and GitHub Release
      pull-requests: write   # open/maintain the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Prefer a PAT so release-please's commits on the release PR TRIGGER
          # required-status-check workflows — commits pushed with the default
          # GITHUB_TOKEN do NOT (GitHub's workflow loop-prevention), which leaves
          # the release PR permanently BLOCKED once checks are required. Falls back
          # to GITHUB_TOKEN when the secret is unset. To activate, create the
          # RELEASE_PLEASE_TOKEN secret from a PAT: classic → `repo` + `workflow`
          # scopes; fine-grained → Contents + Pull requests, both read/write.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
