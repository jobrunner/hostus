# TEMPORARY diagnostic workflow — re-verifies RELEASE_PLEASE_APP_ID /
# RELEASE_PLEASE_APP_KEY permissions after the App's permission grant was
# updated. Does NOT run release-please-action itself. Delete after use.
name: test-release-please-app

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-app-token:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an installation token from the release-please GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}

      - name: Inspect what the minted token can see
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "App slug: ${{ steps.app-token.outputs.app-slug }}"
          echo "--- token's view of this repo (permissions) ---"
          gh api repos/${{ github.repository }} --jq '{full_name, permissions}'
          echo "--- can it write? create+delete a throwaway branch ref ---"
          SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/master --jq '.object.sha')
          gh api repos/${{ github.repository }}/git/refs -f ref="refs/heads/app-token-write-test" -f sha="$SHA" \
            && echo "WRITE OK: created refs/heads/app-token-write-test" \
            && gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/app-token-write-test \
            && echo "cleanup OK: deleted refs/heads/app-token-write-test"
