# TEMPORARY diagnostic workflow — verifies whether the RELEASE_PLEASE_APP_ID /
# RELEASE_PLEASE_APP_KEY secrets mint a working installation token for this
# repo, before wiring them into release-please.yml for real. Does NOT run
# release-please-action itself — no risk of touching the real release PR.
# Delete this file once the test result is known.
name: test-release-please-app

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-app-token:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an installation token from the release-please GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}

      - name: Inspect what the minted token can see
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "App slug: ${{ steps.app-token.outputs.app-slug }}"
          echo "--- token's view of this repo ---"
          gh api repos/${{ github.repository }} --jq '{full_name, permissions}'
          echo "--- token's own installation permissions (contents/pull-requests need write) ---"
          gh api "/repos/${{ github.repository }}/installation" 2>&1 || true
