# dataset.yaml — Beispiel-Manifest für hostus 2.0 (Artefaktvertrag, Spec §D.2 / §4.4).
#
# Dieses Manifest pinnt jeden Backbone- und Trait-Vokabular-Import mit
# fester Version/Lizenz — nie "latest". hostus validiert diese Datei beim
# Ingest doppelt: gegen ein eingebettetes JSON-Schema (2020-12) UND per
# strikter YAML-Dekodierung (unbekannte Felder -> Fehler).

backbones:
  # WCVP (World Checklist of Vascular Plants) — Kew, liefert die IPNI/POWO-IDs.
  - id: wcvp
    version: "2026-06-15" # Datumsversion des WCVP-Dumps, niemals "latest"
    license: CC-BY-4.0
    source: https://sftp.kew.org/pub/data-repositories/WCVP/
    path: ./backbones/wcvp # lokaler Pfad zum entpackten DwC-A-Bundle
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md

  # Catalogue of Life (ColDP-Export) — globaler Cross-Reference-Anschluss.
  - id: colxr
    version: "2026-06-15"
    license: CC-BY-4.0
    source: https://download.checklistbank.org/col/
    path: ./backbones/colxr
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md

  # Euro+Med PlantBase — regionale Konzepte für Mitteleuropa.
  - id: euromed
    version: "2024-12-01"
    path: ./backbones/euromed
    # Keine Lizenz auffindbar (docs/research/quellenregister.md, ❌ blocked)
    # -> lokal genutzt, aber NICHT redistribuierbar, bis geklärt.
    redistribution: unknown

  # FloraVeg.EU — Namensraum für ESy-Vegetationsklassifikation.
  - id: floraveg
    version: "2021-06-01"
    path: ./backbones/floraveg
    note: "ESy-Namensraum, gepinnt — nicht mit EIVE/EuroSL verwechseln"
    # Lizenz ungeklärt (docs/research/quellenregister.md, ⚠️ partially
    # confirmed) -> lokal genutzt, aber NICHT redistribuierbar, bis geklärt.
    redistribution: unknown

# Trait-Vokabulare. `version` MUSS exakt der Spalte `vocab_version` der
# kanonischen CSV entsprechen, die die jeweilige Pipeline erzeugt (siehe
# VOCAB_VERSION in pipelines/<pipeline>/build.sh) — hostus vergleicht beide
# Seiten beim Ingest und bricht bei Abweichung ab, statt Werte unter einer
# falschen Identität zu speichern. `source` ist die Zenodo-DOI des
# Originaldatensatzes (alle drei CC-BY-4.0), nicht der FloraVeg.EU-Download:
# dessen Lizenz ist ungeklärt (docs/research/quellenregister.md), und die
# Angabe wird in trait_vocabulary.source_url persistiert, über die API
# ausgeliefert und in jedes Offline-Bundle kopiert.
trait_vocabularies:
  # Ellenberg-type Indicator Values for Europe (Dengler et al. 2023).
  - id: eive
    version: "1.0"
    taxonomy: euromed-via-eurosl
    license: CC-BY-4.0
    source: https://doi.org/10.5281/zenodo.7534792
    path: pipelines/eive/output/eive-canonical.csv
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md

  # Zeigerwerte nach Tichý et al. 2023, FloraVeg/EUNIS-harmonisiert.
  - id: tichy2023
    version: "2.0"
    taxonomy: floraveg-eunis-aligned
    license: CC-BY-4.0
    source: https://doi.org/10.5281/zenodo.7427088
    path: pipelines/tichy/output/tichy-canonical.csv
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md

  # Zeigerwerte nach Midolo et al. 2023, ebenfalls FloraVeg/EUNIS-Namensraum.
  - id: midolo2023
    version: "3"
    taxonomy: floraveg-eunis-aligned
    license: CC-BY-4.0
    source: https://doi.org/10.5281/zenodo.7116957
    path: pipelines/midolo/output/midolo-canonical.csv
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md
