# dataset.yaml — Beispiel-Manifest für hostus 2.0 (Artefaktvertrag, Spec §D.2 / §4.4).
#
# Dieses Manifest pinnt jeden Backbone- und Trait-Vokabular-Import mit
# fester Version/Lizenz — nie "latest". hostus validiert diese Datei beim
# Ingest doppelt: gegen ein eingebettetes JSON-Schema (2020-12) UND per
# strikter YAML-Dekodierung (unbekannte Felder -> Fehler).

backbones:
  # WCVP (World Checklist of Vascular Plants) — Kew, liefert die IPNI/POWO-IDs.
  - id: wcvp
    version: "2026-06-15" # Datumsversion des WCVP-Dumps, niemals "latest"
    license: CC-BY-4.0
    source: https://sftp.kew.org/pub/data-repositories/WCVP/
    path: ./backbones/wcvp # lokaler Pfad zum entpackten DwC-A-Bundle
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md

  # Catalogue of Life (ColDP-Export) — globaler Cross-Reference-Anschluss.
  - id: colxr
    version: "2026-06-15"
    license: CC-BY-4.0
    source: https://download.checklistbank.org/col/
    path: ./backbones/colxr
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md

  # Euro+Med steht bewusst NICHT hier: als Backbone unbrauchbar (kein Rang,
  # keine Accepted-Verknüpfung — docs/research/reality-check.md). Es wird als
  # NAMENSRAUM `eurosl` geführt (siehe unten): EuroSL.sqlite IST die
  # Euro+Med-Checkliste (Tabelle `EuroPlusMed.Plantae`), nur strukturiert.

# Trait-Vokabulare. `version` MUSS exakt der Spalte `vocab_version` der
# kanonischen CSV entsprechen, die die jeweilige Pipeline erzeugt (siehe
# VOCAB_VERSION in pipelines/<pipeline>/build.sh) — hostus vergleicht beide
# Seiten beim Ingest und bricht bei Abweichung ab, statt Werte unter einer
# falschen Identität zu speichern. `source` ist die Zenodo-DOI des
# Originaldatensatzes (alle drei CC-BY-4.0), nicht der FloraVeg.EU-Download:
# dessen Lizenz ist ungeklärt (docs/research/quellenregister.md), und die
# Angabe wird in trait_vocabulary.source_url persistiert, über die API
# ausgeliefert und in jedes Offline-Bundle kopiert.
trait_vocabularies:
  # Ellenberg-type Indicator Values for Europe (Dengler et al. 2023).
  - id: eive
    version: "1.0"
    taxonomy: euromed-via-eurosl
    license: CC-BY-4.0
    source: https://doi.org/10.5281/zenodo.7534792
    path: pipelines/eive/output/eive-canonical.csv
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md

  # Zeigerwerte nach Tichý et al. 2023, FloraVeg/EUNIS-harmonisiert.
  - id: tichy2023
    version: "2.0"
    taxonomy: floraveg-eunis-aligned
    license: CC-BY-4.0
    source: https://doi.org/10.5281/zenodo.7427088
    path: pipelines/tichy/output/tichy-canonical.csv
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md

  # Zeigerwerte nach Midolo et al. 2023, ebenfalls FloraVeg/EUNIS-Namensraum.
  - id: midolo2023
    version: "3"
    taxonomy: floraveg-eunis-aligned
    license: CC-BY-4.0
    source: https://doi.org/10.5281/zenodo.7116957
    path: pipelines/midolo/output/midolo-canonical.csv
    redistribution: allowed # CC-BY-4.0, docs/research/quellenregister.md

# Namensräume (SP9, UC4). Ein Namensraum ist eine Checkliste, die NAMEN
# beiträgt, aber keine Taxonomie: keine Synonymie, keine Elternkette, keine
# externen IDs zum Joinen — nur eine flache Liste der Schreibweisen, die
# dieser Raum verwendet, je mit der raumeigenen stabilen ID. Gepinnt wird
# EINE kanonische Namenslisten-CSV (Vertrag: pipelines/README.md,
# „Canonical CSV contract (name lists)"), nicht ein DwC-A-Verzeichnis.
#
# Bewusst KEIN `backbones:`-Eintrag — und das ist eine Korrektur, keine
# Geschmacksfrage: FloraVeg stand bis SP9 unter `backbones:` mit
# `path: ./backbones/floraveg`, wurde damit vom WCVP-DwC-A-Reader gelesen
# (internal/app.readerFor liest JEDEN Backbone-Eintrag durch ihn) und war
# deshalb überhaupt nicht ingestierbar. Ein Namensraum erzeugt keine
# taxon_concept-Zeilen; seine Einträge hängen sich per Namens-Crosswalk
# (SP3-Leiter) an Konzepte, die ein Backbone bereits hält.
#
# ACHTUNG Lizenz: Für FloraVeg.EU ist keine Lizenzangabe auffindbar
# (docs/research/quellenregister.md). Daher `redistribution: unknown`:
# lokal auswertbar, aber `hostus bundle` verweigert den Export, solange
# nicht `--force-include-restricted` gesetzt ist (und protokolliert die
# Quelle dann in `bundle_meta.restricted_sources`).
name_spaces:
  - id: floraveg
    version: "2023-01-03" # Blattdatum der Life_form.xlsx, niemals "latest"
    source: https://files.ibot.cas.cz/cevs/downloads/floraveg/Life_form.xlsx
    path: pipelines/floraveg/output/floraveg-canonical.csv
    note: "ESy-Namensraum, gepinnt — nicht mit EIVE/EuroSL verwechseln"
    redistribution: unknown

  # EuroSL = die Euro+Med-Checkliste (EuroSL.sqlite, Tabelle
  # `EuroPlusMed.Plantae`, AccordingTo=euromed) — strukturiert mit Name/Rang/
  # Accepted, daher als Namensraum brauchbar (der frühere flache
  # `euromed`-REST-Crawl ist stillgelegt, siehe pipelines/README.md).
  - id: eurosl
    version: "2024-11-03" # Build-Datum der EuroSL.sqlite (Version-Tabelle)
    source: https://eurosl.infinitenature.org/EuroSL/latest/EuroSL.sqlite
    path: pipelines/eurosl/output/eurosl-canonical.csv
    note: "Euro+Med-Checkliste via EuroSL — keine Lizenz auffindbar, nur lokal"
    redistribution: unknown

# Cross-Reference-Quellen (SP4). Wikidata dient als Bridge-Hub: über die
# powo/ipni-ID jedes Konzepts liefert dieselbe Wikidata-Position gleich
# mehrere externe Autoritäten (u.a. iNaturalist, GBIF, COL, WFO) — ein
# ID-basierter Join, kein Namensabgleich, daher ohne Normalisierungsfragen,
# aber mit ungewisser Deckung (siehe docs/research/reality-check.md, SP4).
xref_sources:
  - id: wikidata
    version: "2026-08-02" # Datum des WDQS-Harvests, niemals "latest"
    license: CC0
    source: https://query.wikidata.org/sparql
    path: pipelines/wikidata/output/wikidata-xref-canonical.csv
    redistribution: allowed # CC0

# Konzeptquellen (SP5, UC6). Eine Konzeptquelle liefert taxonomische
# Konzepte, die je einem `sec.`-Referenzraum zugeordnet sind, plus den
# typisierten Relationsgraphen zwischen ihnen — das, was `/v1/translate`
# braucht. Sie ist bewusst kein `backbones:`-Eintrag: gepinnt wird sie über
# ZWEI kanonische CSVs statt über ein Verzeichnis.
#
# ACHTUNG Lizenz: Für den CDM-Server der „Standardliste der Farn- und
# Blütenpflanzen Deutschlands" ist NIRGENDS eine Lizenzangabe auffindbar —
# weder auf dem Portal noch auf der API noch in den Payloads (siehe
# pipelines/cdm/README.md). Daher `redistribution: unknown`: lokal
# auswertbar, aber `hostus bundle` verweigert den Export, solange nicht
# `--force-include-restricted` gesetzt ist (und protokolliert die Quelle
# dann in `bundle_meta.restricted_sources`).
concept_sources:
  - id: cdm
    version: "2026-08-02" # Datum des Crawls, niemals "latest"
    source: https://api.cybertaxonomy.org/rl_standardliste
    concepts: pipelines/cdm/output/cdm-concepts-canonical.csv
    relations: pipelines/cdm/output/cdm-relations-canonical.csv
    note: "51.466 Konzepte in 18 sec.-Referenzräumen; nur lokale Auswertung"
    redistribution: unknown
