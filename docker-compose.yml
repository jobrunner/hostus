services:
  hostus:
    image: ghcr.io/jobrunner/hostus:latest
    ports:
      - "${HOSTUS_SERVER_PORT:-8080}:${HOSTUS_SERVER_PORT:-8080}"
    environment:
      - HOSTUS_SERVER_HOST=${HOSTUS_SERVER_HOST:-0.0.0.0}
      - HOSTUS_SERVER_PORT=${HOSTUS_SERVER_PORT:-8080}
      - HOSTUS_LOGGING_LEVEL=${HOSTUS_LOGGING_LEVEL:-info}
      - HOSTUS_LOGGING_FORMAT=${HOSTUS_LOGGING_FORMAT:-json}
      - HOSTUS_METRICS_ENABLED=${HOSTUS_METRICS_ENABLED:-true}
      - HOSTUS_CORS_ALLOWED_ORIGINS=${HOSTUS_CORS_ALLOWED_ORIGINS:-*}
      - HOSTUS_TLS_ENABLED=${HOSTUS_TLS_ENABLED:-false}
      - HOSTUS_TELEMETRY_ENABLED=${HOSTUS_TELEMETRY_ENABLED:-false}
      - HOSTUS_SQLITE_PATH=${HOSTUS_SQLITE_PATH:-./data/hostus.db}
    env_file:
      - .env
    restart: unless-stopped
    # Exec-form CMD (no shell needed, works against the distroless static
    # image). This is a process-liveness smoke check only, not an HTTP probe:
    # the image has no shell/curl/wget to hit GET /health/live from inside
    # the container. Orchestrators (Kubernetes, ECS, ...) should probe
    # GET /health/live directly over HTTP instead.
    healthcheck:
      test: ["CMD", "/hostus", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
